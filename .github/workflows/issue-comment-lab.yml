# LAB #570 — reproduz o job `respond` do kof-issues-agent no GitHub REAL: versao ORIGINAL x CORRIGIDA.
# Repo de smoke pessoal, fora do Kof4j.
name: issue-comment-lab
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
  contents: read
jobs:
  original:
    name: original (github.event.action no script)
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.action == 'created'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            if (comment.user.type === 'Bot') return;
            if (github.event.action === 'created' && context.payload.action === 'opened') {
              core.info('unreachable');
            }
  corrected:
    name: corrigido (context.payload.action)
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.action == 'created'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            if (comment.user.type === 'Bot') return;
            if (context.payload.action === 'opened') {
              core.info('unreachable');
            }
