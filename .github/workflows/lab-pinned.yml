# LAB (Onda 2 da MD V6) — variante FIXADA: actions por SHA completo, permissoes por JOB,
# build UMA vez -> atesta -> publica os MESMOS bytes. Repo de smoke pessoal, fora do Kof4j.
name: lab-pinned
on: workflow_dispatch
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Build artifact ONCE
        run: |
          mkdir pkg
          printf 'kof lab artifact\ncommit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > pkg/README.txt
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 -czf "lab-pinned-${GITHUB_RUN_NUMBER}.tar.gz" -C pkg .
          sha256sum lab-pinned-*.tar.gz | tee SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: 'lab-pinned-*.tar.gz'
      - name: Upload the exact bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: pkg
          path: |
            lab-pinned-*.tar.gz
            SHA256SUMS
      - name: PROBE least privilege (must FAIL - build job has contents:read only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release create "probe-${GITHUB_RUN_NUMBER}" --repo "$GITHUB_REPOSITORY" --title probe --notes probe
          echo "PROBE_RC=$?"
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: pkg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "lab-pinned-${GITHUB_RUN_NUMBER}" lab-pinned-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "lab-pinned ${GITHUB_RUN_NUMBER}" --notes "attestation lab (job-level tokens, SHA-pinned)"
